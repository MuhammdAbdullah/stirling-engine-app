<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Stirling Engine</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
    <div class="container">
        <!-- System Status Banner moved to very top -->
        <header>
            <div class="header-row">
                <img src="assets/Matrix 2024 White_Thermodynamics.png" alt="Matrix Thermodynamics" class="matrix-logo">
                <img src="assets/Stirling Engine.png" alt="Stirling Engine" class="header-logo">
            </div>
        </header>
        <div id="systemStatusBanner" class="system-status-banner offline">
            <span class="status-text">SYSTEM OFFLINE</span>
        </div>

        <main>
            <!-- Controls and tiles (always above graphs) -->
            <div class="control-panel">
                <div class="controls-layout">
                    <!-- Heater Control Section (LEFT) -->
                    <div class="heater-control">
                        <div class="control-header">
                            <span class="control-title">HEATER SETPOINT CONTROL</span>
                        </div>
                        <div class="heater-buttons">
                            <button id="heaterToggle" class="heater-btn">Heater ON</button>
                        </div>
                        <div class="heater-slider-container">
                            <div class="heater-slider-wrapper">
                                <div class="heater-slider-fill" id="heaterSliderFill"></div>
                                <input id="heaterSlider" type="range" min="20" max="70" value="20" />
                                <span id="heaterTip" class="slider-tip">20</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <input type="text" id="heaterValue" class="value-display" value="20" />
                                <span style="color: var(--text, #ffffff); font-size: 1.75rem; font-weight: 700;">°C</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Load Control Section (MIDDLE) -->
                    <div class="fan-control">
                        <div class="control-header">
                            <span class="control-title">LOAD CONTROL</span>
                        </div>
                        <!-- Sweep controls inline above Aux slider (same row style as original layout) -->
                        <div class="control-row sweep-row" style="width: 100%;">
                            <label style="min-width:120px; color: var(--text, #ffffff); font-weight: bold;">Sweep (0–100%)</label>
                            <label for="sweepStep" style="color: var(--text, #ffffff);">Step:</label>
                            <input id="sweepStep" type="number" min="1" max="20" value="5" class="num-input" />
                            <label for="sweepInterval" style="color: var(--text, #ffffff);">Interval (ms):</label>
                            <input id="sweepInterval" type="number" min="50" value="200" class="num-input" />
                            <button id="sweepToggle" class="heater-btn">Start Sweep</button>
                        </div>
                        <div class="fan-slider-container">
                            <div class="slider-wrapper">
                                <div class="slider-fill" id="auxSliderFill"></div>
                                <input id="auxSlider" type="range" min="0" max="100" value="0" />
                                <span id="auxTip" class="slider-tip">0</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <input type="text" id="auxValue" class="value-display" value="0" />
                                <span style="color: var(--text, #ffffff); font-size: 1.75rem; font-weight: 700;">%</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- CSV, Calibration and Data Tiles Row (single row) -->
                <div class="control-panel-footer-row" style="margin-top: 1.25rem; display: flex; flex-direction: row; gap: 0.75rem; justify-content: center; align-items: center; flex-wrap: nowrap; width: 100%;">
                    <button id="csvToggle" class="heater-btn" style="flex: 0 0 auto;">Start CSV Save</button>
                    <button id="calibrationButton" class="heater-btn" style="flex: 0 0 auto;">Calibration</button>
                    <div class="tile" style="flex: 0 0 auto;">
                        <div class="tile-label">Temperature (°C)</div>
                        <div id="tempValue" class="tile-value">--</div>
                    </div>
                    <div class="tile" style="flex: 0 0 auto;">
                        <div class="tile-label">Power (W)</div>
                        <div id="powerValue" class="tile-value">--</div>
                    </div>
                    <div class="tile" style="flex: 0 0 auto;">
                        <div class="tile-label">RPM</div>
                        <div id="rpmValue" class="tile-value">--</div>
                    </div>
                    <div class="tile" style="flex: 0 0 auto;">
                        <div class="tile-label">Heater Time (s)</div>
                        <div id="heaterElapsedTime" class="tile-value">0.000</div>
                    </div>
                </div>
            </div>

            <div class="charts-grid" style="margin-top: 10px; align-items: stretch;">
                <!-- Left: Square P–V Chart -->
                <div class="charts-left">
                    <div id="pvContainer" class="chart-container">
                        <canvas id="pvChart"></canvas>
                        <div id="workDisplay" class="work-display">
                            Work:
                            <span id="workValue">--</span>
                            <select id="workUnit" class="work-unit-select">
                                <option value="J">J</option>
                                <option value="mJ">mJ</option>
                                <option value="uJ">µJ</option>
                            </select>
                        </div>
                    </div>
                </div>
                <!-- Right: Time-based charts (Pressure, Volume, Temperature/RPM) stacked to share height -->
                <div class="charts-right time-col">
                    <div id="pressureTimeContainer" class="chart-container time-cell">
                        <canvas id="pressureTimeChart"></canvas>
                    </div>
                    <div id="volumeTimeContainer" class="chart-container time-cell">
                        <canvas id="volumeTimeChart"></canvas>
                    </div>
                    <!-- New 4th graph: Time vs Temperature/RPM with user-selectable Y axis -->
                    <div id="tempRpmTimeContainer" class="chart-container time-cell">
                        <div class="time-chart-header">
                            <span class="time-chart-title">Time Graph:</span>
                            <select id="timeSeriesMode" class="time-chart-select">
                                <option value="temperature">Temperature (°C)</option>
                                <option value="rpm">RPM</option>
                            </select>
                        </div>
                        <canvas id="tempRpmTimeChart"></canvas>
                    </div>
                </div>
            </div>

                <div class="admin-top-right">
                    <label for="themeSelector" style="color: white; margin-right: 10px;">Theme:</label>
                    <select id="themeSelector" class="theme-selector">
                        <option value="light">Light</option>
                        <option value="dark" selected>Dark</option>
                    </select>
                    <button id="adminButton" class="btn btn-admin">⚙️ Admin</button>
                </div>

            <div class="status" style="display:none;">
                <div class="status-item">
                    <span class="label">Status:</span>
                    <span id="statusText" class="value">Ready</span>
                </div>
                <div class="status-item">
                    <span class="label">Data Points:</span>
                    <span id="dataCount" class="value">0</span>
                </div>
                <div class="status-item">
                    <span class="label">Current Temp:</span>
                    <span id="currentTemp" class="value">--°C</span>
                </div>
                <div class="status-item">
                    <span class="label">Debug Mode:</span>
                    <span id="debugStatus" class="value">OFF</span>
                </div>
            </div>

        </main>
    </div>

    <!-- Password Modal -->
    <div id="passwordModal" class="password-modal">
        <div class="password-modal-content">
            <h3>Admin Access</h3>
            <p>Enter password to access admin panel:</p>
            <input type="password" id="passwordInput" placeholder="Enter password" />
            <div class="password-modal-buttons">
                <button id="passwordCancelBtn" class="btn btn-cancel">Cancel</button>
                <button id="passwordSubmitBtn" class="btn btn-submit">Submit</button>
            </div>
            <div id="passwordError" class="password-error" style="display:none;">Incorrect password!</div>
        </div>
    </div>

    <!-- Calibration Modal -->
    <div id="calibrationModal" class="password-modal">
        <div class="password-modal-content">
            <h3>Calibration</h3>
            <input type="text" id="calibrationValue" readonly placeholder="Waiting for data..." />
            <div class="password-modal-buttons">
                <button id="zeroButton" class="btn btn-connect">Zero</button>
                <button id="doneButton" class="btn btn-submit">Done</button>
            </div>
        </div>
    </div>

    <!-- Include Chart.js - try node_modules first, fallback to lib -->
    <script>
        (function() {
            const script1 = document.createElement('script');
            script1.src = 'node_modules/chart.js/dist/chart.umd.js';
            script1.onerror = function() {
                console.log('Chart.js not in node_modules, trying lib folder...');
                const script2 = document.createElement('script');
                script2.src = 'lib/chart.min.js';
                script2.onload = function() {
                    console.log('Chart.js loaded from lib folder');
                    loadRemainingScripts();
                };
                script2.onerror = function() {
                    console.error('Failed to load Chart.js from both locations!');
                    alert('Error: Chart.js library failed to load. The app may not work correctly.');
                };
                document.head.appendChild(script2);
            };
            script1.onload = function() {
                console.log('Chart.js loaded from node_modules');
                loadRemainingScripts();
            };
            document.head.appendChild(script1);
            
            function loadRemainingScripts() {
                // Load Stirling data parser
                const parserScript = document.createElement('script');
                parserScript.src = 'stirling-data-parser.js';
                parserScript.onload = function() {
                    // Load renderer script
                    const rendererScript = document.createElement('script');
                    rendererScript.src = 'renderer.js';
                    document.body.appendChild(rendererScript);
                };
                document.body.appendChild(parserScript);
            }
        })();
    </script>
</body>
</html>
